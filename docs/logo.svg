<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-label="A black cat peeking up, with ring eyes">
  <!-- App icon: our cat peeking up from the bottom of a plain tile. One blob with two small ears at its
       corners and ring eyes. No neck, no tail, no mouth, no whiskers. -->
  <defs>
    <clipPath id="tile"><rect x="64" y="64" width="896" height="896" rx="204"/></clipPath>
  </defs>
  <g clip-path="url(#tile)">
    <rect x="64" y="64" width="896" height="896" fill="#f5f4f0"/>
    <g transform="translate(512 20) scale(1.18) translate(-499 0)">
      <path fill="#141416" d="M214 1024 L246 560 Q250 500 276 462 L312 352 Q330 312 356 348 L414 446 Q500 432 586 446 L640 344 Q664 308 684 350 L722 462 Q748 500 752 560 L784 1024 Z"/>
      <circle cx="396" cy="640" r="64" fill="#fff"/>
      <circle cx="602" cy="640" r="64" fill="#fff"/>
      <circle cx="396" cy="640" r="36" fill="#141416"/>
      <circle cx="602" cy="640" r="36" fill="#141416"/>
    </g>
  </g>
</svg>
