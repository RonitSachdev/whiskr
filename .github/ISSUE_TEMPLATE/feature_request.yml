name: Feature request
description: Suggest an idea or an improvement.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Whiskr leaves a lot out on purpose. docs/DESIGN.md lists what it is, what it is not, and the rules it follows.
        Describing the problem you have is more useful than a finished design.

  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true

  - type: textarea
    id: idea
    attributes:
      label: What you would like
      description: How you imagine it working. Optional.

  - type: textarea
    id: alternatives
    attributes:
      label: What you do instead today
      description: Workarounds, or how other tools handle it. Optional.
