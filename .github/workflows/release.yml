name: Release

# Builds the Release configuration, packages it as an unsigned zip with its SHA-256 checksum, and makes a
# DRAFT GitHub release with notes from CHANGELOG.md. Nothing is published: a maintainer reviews the draft
# and publishes it by hand. No signing, notarisation, certificates or secrets are involved: the app keeps
# only the ad-hoc signature the linker gives each executable. See docs/RELEASING.md.
#
# Runs only for a pushed version tag (v0.1.0) or by hand (Actions › Release › Run workflow).
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag for the draft release, e.g. v0.1.0 (the tag is created when the draft is published)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  XCODE_PATH: /Applications/Xcode_26.1.1.app

jobs:
  draft-release:
    name: Build and draft the release
    runs-on: macos-26
    timeout-minutes: 60
    permissions:
      # Only to create the draft release and attach its files.
      contents: write
    defaults:
      run:
        working-directory: native/App
    env:
      TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Select Xcode
        run: |
          sudo xcode-select --switch "$XCODE_PATH"
          xcodebuild -version

      - name: Check the tag against the app's version
        run: |
          case "$TAG" in v[0-9]*) ;; *) echo "::error::The tag must look like v0.1.0 (got '$TAG')"; exit 1 ;; esac
          version=$(sed -n 's/^ *MARKETING_VERSION: *"\(.*\)"$/\1/p' project.yml)
          if [ "v$version" != "$TAG" ]; then
            echo "::error::$TAG does not match MARKETING_VERSION $version in native/App/project.yml"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Tests
        run: make test SCRATCH="$RUNNER_TEMP/whiskr"

      - name: Build and package (unsigned)
        run: make dist DERIVED="$RUNNER_TEMP/derived" SCRATCH="$RUNNER_TEMP/whiskr" DIST="$RUNNER_TEMP/dist"

      - name: Release notes from CHANGELOG.md
        run: Scripts/release-notes.sh "$VERSION" ../../CHANGELOG.md > "$RUNNER_TEMP/notes.md"

      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" "$RUNNER_TEMP"/dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --draft \
            --target "$GITHUB_SHA" \
            --title "Whiskr $VERSION" \
            --notes-file "$RUNNER_TEMP/notes.md"
